---
layout: default
---

<div class="posts">
  {% for post in site.posts %}
    <article class="post">

      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>
      {% if post.subtitle %}
        <h4>{{ post.subtitle }}</h4>
      {% endif %}

      <div class="entry">
        {{ post.excerpt }}
      </div>

      
    {% if post.excerpt_separator %}
      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
      {% endif %}
    </article>
  {% endfor %}
</div>
